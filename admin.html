<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NoteHub — Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">NoteHub</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="notes.html">Notes</a>
      <a href="upload.html">Upload</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="container">
    <h2>Admin — Pending Uploads</h2>

    <p class="muted">Basic password required to view admin controls.</p>
    <div>
      <input id="adminPass" placeholder="Admin password" type="password" />
      <button id="unlock" class="btn">Unlock</button>
    </div>

    <div id="pending" class="cards"></div>
  </main>

  <footer class="footer">© 2025 NoteHub</footer>

  <script type="module">
    import { initFirebase } from './firebase.js';
    // same firebaseConfig — replace with yours
    const firebaseConfig = {
      apiKey: "REPLACE_ME",
      authDomain: "REPLACE_ME",
      projectId: "REPLACE_ME",
      storageBucket: "REPLACE_ME",
      messagingSenderId: "REPLACE_ME",
      appId: "REPLACE_ME"
    };
    initFirebase(firebaseConfig);

    // CHANGE THIS password to something secure before you use in production
    const ADMIN_PASSWORD = 'notehub-admin-2025';

    setTimeout(() => {
      (async () => {
        const { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc } =
          await import('https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js');
        const { ref, deleteObject } =
          await import('https://www.gstatic.com/firebasejs/9.22.2/firebase-storage.js');

        const firebaseModule = await import('./firebase.js');
        while (!firebaseModule.db) { await new Promise(r => setTimeout(r, 200)); }
        const db = firebaseModule.db;
        const storage = firebaseModule.storage;

        const unlockBtn = document.getElementById('unlock');
        const passEl = document.getElementById('adminPass');
        const pendingEl = document.getElementById('pending');

        let unlocked = false;

        unlockBtn.addEventListener('click', () => {
          if (passEl.value === ADMIN_PASSWORD) {
            unlocked = true;
            passEl.value = '';
            loadPending();
            alert('Admin unlocked — you can approve or delete items.');
          } else {
            alert('Wrong password.');
          }
        });

        async function loadPending() {
          pendingEl.innerHTML = '<p class="muted">Loading pending uploads...</p>';
          const materialsRef = collection(db, 'materials');
          const q = query(materialsRef, where('approved', '==', false));
          const snap = await getDocs(q);
          const items = [];
          snap.forEach(d => items.push({ id: d.id, ...d.data() }));
          render(items);
        }

        function render(items) {
          if (!items.length) {
            pendingEl.innerHTML = '<p class="muted">No pending uploads.</p>';
            return;
          }
          pendingEl.innerHTML = '';
          items.forEach(it => {
            const card = document.createElement('div');
            card.className = 'card';
            const h = document.createElement('h3'); h.innerText = it.title || 'Untitled';
            const meta = document.createElement('p'); meta.className = 'meta';
            meta.innerText = `${it.subject || '—'} • ${it.type || ''}`;
            const desc = document.createElement('p'); desc.innerText = it.description || '';
            const actions = document.createElement('div'); actions.className = 'card-actions';
            const approveBtn = document.createElement('button'); approveBtn.className = 'btn small';
            approveBtn.innerText = 'Approve';
            const delBtn = document.createElement('button'); delBtn.className = 'btn small ghost';
            delBtn.innerText = 'Delete';
            actions.appendChild(approveBtn);
            actions.appendChild(delBtn);
            card.appendChild(h);
            card.appendChild(meta);
            card.appendChild(desc);
            card.appendChild(actions);
            pendingEl.appendChild(card);

            approveBtn.addEventListener('click', async () => {
              if (!unlocked) return alert('Unlock admin first');
              await updateDoc(doc(db, 'materials', it.id), { approved: true });
              card.remove();
            });

            delBtn.addEventListener('click', async () => {
              if (!unlocked) return alert('Unlock admin first');
              if (!confirm('Delete this upload permanently?')) return;
              // delete storage file
              try {
                const storageRef = ref(storage, it.storagePath);
                await deleteObject(storageRef);
              } catch (e) {
                console.warn('Could not delete storage file (may not exist)', e);
              }
              // delete firestore doc
              await deleteDoc(doc(db, 'materials', it.id));
              card.remove();
            });
          });
        }

      })();
    }, 300);
  </script>
</body>
</html>
