<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upload — NoteHub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="bg-animation"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script>
VANTA.NET({ el:"#bg-animation", color:0x5cf0ff, backgroundColor:0x020617 });
</script>

<header>
  <div class="logo">NoteHub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="notes.html">Notes</a>
    <a href="upload.html">Upload</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<div class="page-hero">
  <h1>Upload Material</h1>
  <p>Share notes, PYQs or study files with students.</p>
</div>

<main class="container">
  <form id="uploadForm" class="card">

    <input id="title" class="input" placeholder="Title" required>
    <input id="subject" class="input" placeholder="Subject" required>

    <select id="type" class="input">
      <option>Note</option>
      <option>PYQ</option>
    </select>

    <input id="tags" class="input" placeholder="Tags (comma separated)">
    <textarea id="desc" class="input" placeholder="Description"></textarea>

    <input id="file" type="file" class="input" accept="application/pdf" required>

    <button class="btn" type="submit">Upload</button>
    <p id="status" class="muted"></p>
  </form>
</main>

<footer>© 2025 NoteHub</footer>

<script type="module">
import { initFirebase, db } from "./firebase.js";
import { uploadToCloudinary } from "./cloudinary.js";
import { collection, addDoc, serverTimestamp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

initFirebase({
  apiKey: "AIzaSyDKt2SwZ8huxz9kmXhqkvHTQWRwnE8MUO8",
  authDomain: "studyhub-519c3.firebaseapp.com",
  projectId: "studyhub-519c3",
  storageBucket: "studyhub-519c3.firebasestorage.app",
  messagingSenderId: "154821601505",
  appId: "1:154821601505:web:84012068aba30ada806fa0"
});

document.getElementById("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("status");

  status.textContent = "Uploading to Cloudinary...";
  const file = document.getElementById("file").files[0];
  const url = await uploadToCloudinary(file);

  status.textContent = "Saving to Firestore...";

  await addDoc(collection(db,"materials"),{
    title: title.value,
    subject: subject.value,
    type: type.value,
    tags: tags.value,
    description: desc.value,
    url: url,
    approved: false,
    createdAt: serverTimestamp()
  });

  status.textContent = "Upload complete — pending admin approval.";
  e.target.reset();
});
</script>

</body>
</html>
