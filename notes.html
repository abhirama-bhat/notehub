<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Notes — NoteHub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="bg-animation"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script>
VANTA.NET({ el:"#bg-animation", color:0x5cf0ff, backgroundColor:0x020617 });
</script>

<header>
  <div class="logo">NoteHub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="notes.html">Notes</a>
    <a href="upload.html">Upload</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<div class="page-hero">
  <h1>Browse Notes</h1>
  <p>Find notes, PYQs, and uploaded materials instantly.</p>
</div>

<main class="container">
  <input id="search" class="input" placeholder="Search by title, subject, tags...">
  <div id="cards"></div>
</main>

<footer>© 2025 NoteHub</footer>

<script type="module">
import { initFirebase, db } from "./firebase.js";
import { collection, query, where, orderBy, getDocs }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

initFirebase({
  apiKey: "AIzaSyDKt2SwZ8huxz9kmXhqkvHTQWRwnE8MUO8",
  authDomain: "studyhub-519c3.firebaseapp.com",
  projectId: "studyhub-519c3",
  storageBucket: "studyhub-519c3.firebasestorage.app",
  messagingSenderId: "154821601505",
  appId: "1:154821601505:web:84012068aba30ada806fa0"
});

const search = document.getElementById("search");
const cards = document.getElementById("cards");

async function load() {
  cards.innerHTML = "<p class='muted'>Loading...</p>";

  const q = query(
    collection(db, "materials"),
    where("approved", "==", true),
    orderBy("createdAt", "desc")
  );

  const snap = await getDocs(q);
  const list = [];
  snap.forEach(d => list.push(d.data()));

  render(list);
}

function render(list) {
  const q = search.value.toLowerCase();
  cards.innerHTML = "";

  list.filter(it =>
    it.title.toLowerCase().includes(q) ||
    it.subject.toLowerCase().includes(q) ||
    it.tags.toLowerCase().includes(q)
  ).forEach(it => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h3>${it.title}</h3>
      <p class="muted">${it.subject} • ${it.type}</p>
      <p>${it.description}</p>
      <div class="card-actions">
        <a class="btn small" href="${it.url}" target="_blank">View PDF</a>
      </div>
    `;
    cards.appendChild(div);
  });
}

search.addEventListener("input", load);
load();
</script>

</body>
</html>
