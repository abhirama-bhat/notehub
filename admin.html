<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <div class="logo">NoteHub</div>
</header>

<main class="container">
  <h1>Admin Panel</h1>

  <div class="card">
    <input id="pass" class="input" placeholder="Admin password">
    <button id="unlock" class="btn">Unlock</button>
  </div>

  <div id="pending"></div>
</main>

<footer>© 2025 NoteHub</footer>

<script type="module">
import { initFirebase, db } from "./firebase.js";
import { collection, getDocs, doc, updateDoc, deleteDoc }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

initFirebase();

unlock.onclick = async () => {
  if (pass.value !== "notehub-admin-2025") return alert("Wrong password");

  const snap = await getDocs(collection(db,"materials"));
  pending.innerHTML = "";

  snap.forEach(d=>{
    const it=d.data();
    if(it.approved) return;

    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <h3>${it.title}</h3>
      <p>${it.subject} • ${it.type}</p>
      <div class="card-actions">
        <a class="btn ghost" href="${it.url}" download>Download</a>
        <button class="btn">Approve</button>
        <button class="btn ghost">Delete</button>
      </div>
    `;

    div.children[2].children[1].onclick=()=>updateDoc(doc(db,"materials",d.id),{approved:true});
    div.children[2].children[2].onclick=()=>deleteDoc(doc(db,"materials",d.id));

    pending.appendChild(div);
  });
};
</script>

</body>
</html>
