<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NoteHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📘 NoteHub</h1>

<div class="filters">
  <select id="cluster">
    <option value="">Select Cluster</option>
    <option value="CS">CS</option>
    <option value="ME">ME</option>
    <option value="EC">EC</option>
    <option value="CV">CV</option>
  </select>

  <select id="subject">
    <option value="">Select Subject</option>
  </select>

  <select id="module">
    <option value="">Select Module</option>
  </select>
</div>

<input id="search" type="text" placeholder="Search notes...">

<div id="notes"></div>

<hr>

<div class="actions">
  <a href="admin.html">➕ Submit Notes</a>
  <a href="mailto:notehub.admin@gmail.com?subject=Notes%20Request">📩 Request Notes</a>
</div>

<script src="script.js"></script>
</body>
</html>
