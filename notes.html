<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Notes — NoteHub</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="bg-animation"></div>

<header>
  <div class="logo">NoteHub</div>
  <nav>
    <a href="/">Home</a>
    <a href="/upload">Upload</a>
    <a href="/issues">Report Issue</a>
    <a href="/admin">Admin</a>
  </nav>
</header>

<main class="container">
  <h1>Browse Notes</h1>
  <p class="muted">Filter & find notes quickly — Pinned, All, or Trending.</p>

  <div class="card">
    <div class="tabs">
      <div id="tabPinned" class="tab active">Pinned</div>
      <div id="tabAll" class="tab">All</div>
      <div id="tabTrending" class="tab">Trending</div>
    </div>

    <div class="top-controls">
      <div class="filters">
        <select id="f-subject" class="input"><option value="">Subject (A–E)</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select>
        <select id="f-module" class="input"><option value="">Module</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        <select id="f-type" class="input"><option value="">Type</option><option>Note</option><option>PYQ</option></select>
        <select id="f-sort" class="input"><option value="new">Newest</option><option value="views">Most Viewed</option></select>
      </div>
      <button id="clearFilters" class="btn small ghost">Clear</button>
    </div>

    <div id="pinnedRow" class="pinned-row"></div>
    <div id="resultsGrid" class="grid"></div>
    <div id="noResults" class="muted" style="display:none">No notes found.</div>
  </div>
</main>

<footer>© 2025 NoteHub</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<script type="module" src="/script.js"></script>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  VANTA.NET({ el:"#bg-animation", color:0x5cf0ff, backgroundColor:0x020617 });
});
</script>

</body>
</html>
