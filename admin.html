<script type="module">
  import { db } from "./firebase.js";

  import {
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const ADMIN_PASSWORD = "notehub-admin-2025";
  let unlocked = false;

  const unlockBtn = document.getElementById("unlock");
  const pendingEl = document.getElementById("pending");

  unlockBtn.addEventListener("click", () => {
    const pass = document.getElementById("adminPass").value;
    if (pass === ADMIN_PASSWORD) {
      unlocked = true;
      loadPending();
      alert("Admin unlocked.");
    } else {
      alert("Wrong password!");
    }
  });

  async function loadPending() {
    pendingEl.innerHTML = "<p class='muted'>Loading...</p>";

    const q = query(collection(db, "materials"), where("approved", "==", false));
    const snap = await getDocs(q);

    pendingEl.innerHTML = "";

    snap.forEach(d => {
      const data = d.data();

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${data.title}</h3>
        <p class="meta">${data.subject} • ${data.type}</p>
        <p>${data.description || ""}</p>
      `;

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const approveBtn = document.createElement("button");
      approveBtn.className = "btn small";
      approveBtn.innerText = "Approve";

      const delBtn = document.createElement("button");
      delBtn.className = "btn small ghost";
      delBtn.innerText = "Delete";

      actions.appendChild(approveBtn);
      actions.appendChild(delBtn);
      card.appendChild(actions);
      pendingEl.appendChild(card);

      approveBtn.addEventListener("click", async () => {
        if (!unlocked) return alert("Unlock admin first.");
        await updateDoc(doc(db, "materials", d.id), { approved: true });
        card.remove();
      });

      delBtn.addEventListener("click", async () => {
        if (!unlocked) return alert("Unlock admin first.");
        if (!confirm("Delete this upload?")) return;
        await deleteDoc(doc(db, "materials", d.id));
        card.remove();
      });
    });
  }
</script>
