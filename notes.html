<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browse Notes | NoteHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">NoteHub</div>
  <nav>
    <a href="index.html">Home</a>
  </nav>
</header>

<main class="container">
  <h1>Browse Notes</h1>
  <p class="muted">Filter and download notes.</p>

  <div class="card">
    <div class="filters">
      <select><option>Subject</option></select>
      <select><option>Module</option></select>
      <select><option>Type</option></select>
    </div>
  </div>

  <div class="card">
    <h3>Sample Note</h3>
    <p class="muted">Subject A • Module 1 • Note</p>
    <p>Dummy content for UI testing.</p>

    <div class="card-actions">
      <a class="btn ghost"
         href="https://github.com/example/example/releases/download/v1/sample.pdf"
         download
         target="_blank">
        Download PDF
      </a>
    </div>
  </div>
</main>

<footer>© 2025 NoteHub</footer>

</body>
</html>
