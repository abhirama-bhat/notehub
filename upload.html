<script type="module">
  import { db } from "./firebase.js";
  import uploadToCloudinary from "./cloudinary.js";

  import {
    collection,
    addDoc,
    Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const form = document.getElementById("uploadForm");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const title = document.getElementById("title").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const type = document.getElementById("type").value;
    const tags = document.getElementById("tags").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const file = document.getElementById("file").files[0];

    if (!file) {
      status.innerText = "❌ Select a PDF file!";
      return;
    }

    status.innerText = "⏳ Uploading PDF to Cloudinary...";

    try {
      // 1) Upload file → Cloudinary
      const pdfUrl = await uploadToCloudinary(file);

      status.innerText = "⏳ Saving details in Firestore...";

      // 2) Save metadata in Firestore
      await addDoc(collection(db, "materials"), {
        title,
        subject,
        type,
        tags,
        description: desc,
        url: pdfUrl,          // Final Cloudinary link
        approved: false,      // Pending approval
        createdAt: Timestamp.now()
      });

      status.innerText = "✅ Upload successful — pending admin approval!";
      form.reset();

    } catch (err) {
      console.error(err);
      status.innerText = "❌ Upload failed.";
    }
  });
</script>
