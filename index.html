<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NoteHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <h3>Cluster</h3>
    <button class="filter" data-tag="CS">CS Cluster</button>
    <button class="filter" data-tag="EE">EE Cluster</button>
    <button class="filter" data-tag="ME">ME Cluster</button>

    <h3>Cycle</h3>
    <button class="filter" data-tag="P-Cycle">P-Cycle</button>
    <button class="filter" data-tag="C-Cycle">C-Cycle</button>

    <h3>Semester</h3>
    <button class="filter" data-tag="Sem 1">Sem 1</button>
    <button class="filter" data-tag="Sem 2">Sem 2</button>
  </aside>

  <!-- MAIN CONTENT -->
  <main>
    <input type="text" id="search" placeholder="Search subject...">
    <div id="notes"></div>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
