<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NoteHub — Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">NoteHub</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="notes.html">Notes</a>
      <a href="upload.html">Upload</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="container">
    <h2>Find Notes</h2>

    <div class="controls">
      <input id="search" placeholder="Search by title, subject, tag..." />
      <select id="typeFilter">
        <option value="">All Types</option>
        <option value="Note">Note</option>
        <option value="PYQ">PYQ</option>
      </select>
    </div>

    <div id="cards" class="cards">
      <!-- cards will be inserted here -->
    </div>
  </main>

  <footer class="footer">© 2025 NoteHub</footer>

  <script type="module">
    import { initFirebase } from './firebase.js';
    // IMPORTANT: Replace this config with yours
    const firebaseConfig = {
      apiKey: "REPLACE_ME",
      authDomain: "REPLACE_ME",
      projectId: "REPLACE_ME",
      storageBucket: "REPLACE_ME",
      messagingSenderId: "REPLACE_ME",
      appId: "REPLACE_ME"
    };
    initFirebase(firebaseConfig);

    // small delay to allow firebase.js to load then import Firestore functions
    setTimeout(() => {
      (async () => {
        const { getFirestore, collection, query, where, getDocs, orderBy } =
          await import('https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js');

        const { getStorage, ref, getDownloadURL } =
          await import('https://www.gstatic.com/firebasejs/9.22.2/firebase-storage.js');

        // access db from firebase.js (global in module scope)
        const dbModule = await import('./firebase.js');
        // dbModule.db will be undefined until firebase app is initialized, so wait
        let waitForDb = 0;
        while (!dbModule.db && waitForDb < 30) { await new Promise(r => setTimeout(r, 200)); waitForDb++; }
        const db = dbModule.db;
        const storage = dbModule.storage;

        const cardsEl = document.getElementById('cards');
        const searchEl = document.getElementById('search');
        const typeFilter = document.getElementById('typeFilter');

        async function loadMaterials() {
          cardsEl.innerHTML = '<p class="muted">Loading...</p>';
          const materialsRef = collection(db, 'materials');
          // only show approved
          const q = query(materialsRef, where('approved', '==', true), orderBy('createdAt', 'desc'));
          const snap = await getDocs(q);
          const items = [];
          snap.forEach(doc => {
            items.push({ id: doc.id, ...doc.data() });
          });
          renderList(items);
        }

        function renderList(items) {
          const qText = (searchEl.value || '').toLowerCase();
          const type = typeFilter.value;
          let filtered = items.filter(it => {
            if (type && it.type !== type) return false;
            if (!qText) return true;
            return (it.title || '').toLowerCase().includes(qText)
              || (it.subject || '').toLowerCase().includes(qText)
              || (it.tags || '').toLowerCase().includes(qText);
          });
          if (!filtered.length) {
            cardsEl.innerHTML = '<p class="muted">No notes found.</p>';
            return;
          }
          cardsEl.innerHTML = '';
          filtered.forEach(async it => {
            const card = document.createElement('div');
            card.className = 'card';
            const title = document.createElement('h3');
            title.innerText = it.title || 'Untitled';
            const meta = document.createElement('p');
            meta.className = 'meta';
            meta.innerText = `${it.subject || '—'} • ${it.type || '—'}`;
            const actions = document.createElement('div');
            actions.className = 'card-actions';
            // get file URL
            try {
              const url = await getDownloadURL(ref(storage, it.storagePath));
              const a = document.createElement('a');
              a.href = url;
              a.target = '_blank';
              a.rel = 'noopener';
              a.innerText = 'Preview / Download';
              a.className = 'btn small';
              actions.appendChild(a);
            } catch (e) {
              const span = document.createElement('span');
              span.className = 'muted';
              span.innerText = 'File not available';
              actions.appendChild(span);
            }
            card.appendChild(title);
            card.appendChild(meta);
            if (it.description) {
              const p = document.createElement('p');
              p.innerText = it.description;
              card.appendChild(p);
            }
            card.appendChild(actions);
            cardsEl.appendChild(card);
          });
        }

        searchEl.addEventListener('input', () => loadMaterials());
        typeFilter.addEventListener('change', () => loadMaterials());

        loadMaterials();
      })();
    }, 300);
  </script>
</body>
</html>
