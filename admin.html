<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — NoteHub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="bg-animation"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<script>
let vantaEffect;

function initVanta() {
  if (vantaEffect) vantaEffect.destroy();

  const isMobile = window.innerWidth < 768;

  vantaEffect = VANTA.NET({
    el: "#bg-animation",
    color: 0x5cf0ff,
    backgroundColor: 0x020617,
    scale: 1.0,
    scaleMobile: 1.0,
    points: isMobile ? 3 : 10,
    maxDistance: isMobile ? 10 : 22,
    spacing: isMobile ? 14 : 18
  });
}

document.addEventListener("DOMContentLoaded", initVanta);
window.addEventListener("resize", () => {
  clearTimeout(window.vantaTimeout);
  window.vantaTimeout = setTimeout(initVanta, 250);
});
</script>

<header>
  <div class="logo">NoteHub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="notes.html">Notes</a>
    <a href="upload.html">Upload</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main class="container page-hero">
  <h1>Admin Panel</h1>
  <p>Approve or delete uploaded files.</p>

  <input id="pass" class="input" placeholder="Enter admin password">
  <button id="unlock" class="btn">Unlock</button>

  <div id="pending"></div>
</main>

<footer>© 2025 NoteHub</footer>

<script type="module">
import { initFirebase, db } from "./firebase.js";
import { collection, query, where, getDocs, doc, updateDoc, deleteDoc }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

initFirebase({
  apiKey: "AIzaSyDKt2SwZ8huxz9kmXhqkvHTQWRwnE8MUO8",
  authDomain: "studyhub-519c3.firebaseapp.com",
  projectId: "studyhub-519c3",
  storageBucket: "studyhub-519c3.firebasestorage.app",
  messagingSenderId: "154821601505",
  appId: "1:154821601505:web:84012068aba30ada806fa0"
});

const ADMIN_PASS = "notehub-admin-2025";

const pending = document.getElementById("pending");

document.getElementById("unlock").onclick = async () => {
  if (document.getElementById("pass").value !== ADMIN_PASS)
    return alert("Wrong Password!");

  loadPending();
};

async function loadPending() {
  pending.innerHTML = "<p class='muted'>Loading...</p>";

  const q = query(collection(db, "materials"), where("approved", "==", false));
  const snap = await getDocs(q);

  pending.innerHTML = "";

  snap.forEach(d => {
    const it = d.data();

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h3>${it.title}</h3>
      <p class="muted">${it.subject} • ${it.type}</p>
      <p>${it.description}</p>
    `;

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const approve = document.createElement("button");
    approve.className = "btn small";
    approve.innerText = "Approve";

    const del = document.createElement("button");
    del.className = "btn small ghost";
    del.innerText = "Delete";

    approve.onclick = async () => {
      await updateDoc(doc(db, "materials", d.id), { approved: true });
      div.remove();
    };

    del.onclick = async () => {
      await deleteDoc(doc(db, "materials", d.id));
      div.remove();
    };

    actions.appendChild(approve);
    actions.appendChild(del);
    div.appendChild(actions);

    pending.appendChild(div);
  });
}
</script>

</body>
</html>
