<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NoteHub — Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="logo">NoteHub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="notes.html">Notes</a>
    <a href="upload.html">Upload</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main class="container">
  <h2>Find Notes</h2>

  <div class="controls">
    <input id="search" placeholder="Search by title, subject, tag...">
    <select id="typeFilter">
      <option value="">All Types</option>
      <option value="Note">Note</option>
      <option value="PYQ">PYQ</option>
    </select>
  </div>

  <div id="cards" class="cards"></div>
</main>

<footer class="footer">© 2025 NoteHub</footer>

<script type="module">
  import { initFirebase, db } from "./firebase.js";
  import { collection, query, where, getDocs, orderBy } from 
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  initFirebase({
    apiKey: "AIzaSyDKt2SwZ8huxz9kmXhqkvHTQWRwnE8MUO8",
    authDomain: "studyhub-519c3.firebaseapp.com",
    projectId: "studyhub-519c3",
    storageBucket: "studyhub-519c3.firebasestorage.app",
    messagingSenderId: "154821601505",
    appId: "1:154821601505:web:84012068aba30ada806fa0",
    measurementId: "G-YG6H2PEP1G"
  });

  const cardsEl = document.getElementById("cards");
  const searchEl = document.getElementById("search");
  const typeFilter = document.getElementById("typeFilter");

  async function loadMaterials() {
    cardsEl.innerHTML = "<p class='muted'>Loading...</p>";

    const q = query(
      collection(db, "materials"),
      where("approved", "==", true)
    );

    const snap = await getDocs(q);
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    render(items);
  }

  function render(items) {
    const search = searchEl.value.toLowerCase();
    const type = typeFilter.value;

    const filtered = items.filter(item => {
      if (type && item.type !== type) return false;
      return (
        item.title.toLowerCase().includes(search) ||
        item.subject.toLowerCase().includes(search) ||
        (item.tags || "").toLowerCase().includes(search)
      );
    });

    cardsEl.innerHTML = "";

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${item.title}</h3>
        <p class="meta">${item.subject} • ${item.type}</p>
      `;

      if (item.description) {
        const desc = document.createElement("p");
        desc.innerText = item.description;
        card.appendChild(desc);
      }

      // CLOUDINARY URL (not Firebase storage)
      const btn = document.createElement("a");
      btn.href = item.url;
      btn.target = "_blank";
      btn.className = "btn small";
      btn.innerText = "Preview / Download";

      const actions = document.createElement("div");
      actions.className = "card-actions";
      actions.appendChild(btn);

      card.appendChild(actions);
      cardsEl.appendChild(card);
    });
  }

  searchEl.addEventListener("input", loadMaterials);
  typeFilter.addEventListener("change", loadMaterials);

  loadMaterials();
</script>

</body>
</html>
