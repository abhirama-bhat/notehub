<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Notes — NoteHub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="bg-animation"></div>

<!-- Vanta BG Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<script>
let vantaEffect;

function initVanta() {
  if (vantaEffect) vantaEffect.destroy();

  const isMobile = window.innerWidth < 768;

  vantaEffect = VANTA.NET({
    el: "#bg-animation",
    color: 0x5cf0ff,
    backgroundColor: 0x020617,
    scale: 1.0,
    scaleMobile: 1.0,
    points: isMobile ? 3 : 10,
    maxDistance: isMobile ? 10 : 22,
    spacing: isMobile ? 14 : 18,
    showDots: true
  });
}

document.addEventListener("DOMContentLoaded", initVanta);
window.addEventListener("resize", () => {
  clearTimeout(window.vantaTimeout);
  window.vantaTimeout = setTimeout(initVanta, 250);
});
</script>

<header>
  <div class="logo">NoteHub</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="notes.html">Notes</a>
    <a href="upload.html">Upload</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main class="container page-hero">
  <h1>Browse Notes</h1>
  <p>Find notes, PYQs, and uploaded materials easily.</p>

  <input id="search" class="input" placeholder="Search by title, subject, tags...">
  <div id="cards"></div>
</main>

<footer>© 2025 NoteHub</footer>

<!-- Firebase Script -->
<script type="module">
import { initFirebase, db } from "./firebase.js";
import { collection, query, where, orderBy, getDocs }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

initFirebase({
  apiKey: "AIzaSyDKt2SwZ8huxz9kmXhqkvHTQWRwnE8MUO8",
  authDomain: "studyhub-519c3.firebaseapp.com",
  projectId: "studyhub-519c3",
  storageBucket: "studyhub-519c3.firebasestorage.app",
  messagingSenderId: "154821601505",
  appId: "1:154821601505:web:84012068aba30ada806fa0"
});

const search = document.getElementById("search");
const cards = document.getElementById("cards");

async function load() {
  cards.innerHTML = "<p class='muted'>Loading...</p>";

  const q = query(
    collection(db, "materials"),
    where("approved", "==", true),
    orderBy("createdAt", "desc")
  );

  const snap = await getDocs(q);
  const items = [];
  snap.forEach(d => items.push(d.data()));

  render(items);
}

function render(list) {
  const q = search.value.toLowerCase();
  cards.innerHTML = "";

  list.filter(it =>
    it.title.toLowerCase().includes(q) ||
    it.subject.toLowerCase().includes(q) ||
    it.tags.toLowerCase().includes(q)
  ).forEach(it => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h3>${it.title}</h3>
      <p class="muted">${it.subject} • ${it.type}</p>
      <p>${it.description}</p>
      <div class="card-actions">
        <a class="btn small" href="${it.url}" target="_blank">View PDF</a>
      </div>
    `;
    cards.appendChild(div);
  });
}

search.addEventListener("input", load);
load();
</script>

</body>
</html>
