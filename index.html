<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NoteHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">📘 NoteHub</div>

    <div class="filter-group" data-group="cluster">
      <h4>Cluster</h4>
      <button data-tag="CS">CS</button>
      <button data-tag="EE">EE</button>
      <button data-tag="ME">ME</button>
    </div>

    <div class="filter-group" data-group="cycle">
      <h4>Cycle</h4>
      <button data-tag="P-Cycle">P-Cycle</button>
      <button data-tag="C-Cycle">C-Cycle</button>
    </div>

    <div class="filter-group" data-group="semester">
      <h4>Semester</h4>
      <button data-tag="Sem 1">Sem 1</button>
      <button data-tag="Sem 2">Sem 2</button>
    </div>
  </aside>

  <main class="content">
    <input id="search" placeholder="Search subjects..." />
    <div id="notes"></div>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
