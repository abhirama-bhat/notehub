<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteHub — Home</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Background animation */
    #bg-animation {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -2;
      top: 0;
      left: 0;
    }
    
    /* Loading state for background */
    .bg-loading {
      background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
    }
    
    /* Header styles */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      background-color: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 10;
    }
    
    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: #5cf0ff;
    }
    
    nav {
      display: flex;
      gap: 1.5rem;
    }
    
    nav a {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
      padding: 0.5rem 0;
      position: relative;
    }
    
    nav a:hover {
      color: #5cf0ff;
    }
    
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #5cf0ff;
      transition: width 0.3s ease;
    }
    
    nav a:hover::after {
      width: 100%;
    }
    
    /* Main content */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 5%;
      position: relative;
      z-index: 1;
    }
    
    .hero h1 {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(90deg, #5cf0ff, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .hero p {
      font-size: 1.25rem;
      max-width: 600px;
      margin-bottom: 2.5rem;
      color: #cbd5e1;
    }
    
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    /* Button styles */
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #5cf0ff;
      color: #020617;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      border: 2px solid #5cf0ff;
    }
    
    .btn:hover {
      background-color: transparent;
      color: #5cf0ff;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(92, 240, 255, 0.2);
    }
    
    .btn.ghost {
      background-color: transparent;
      color: #5cf0ff;
      border: 2px solid #5cf0ff;
    }
    
    .btn.ghost:hover {
      background-color: #5cf0ff;
      color: #020617;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: rgba(2, 6, 23, 0.8);
      color: #94a3b8;
      position: relative;
      z-index: 10;
    }
    
    /* Responsive design */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 1rem;
      }
      
      .hero h1 {
        font-size: 2.5rem;
      }
      
      .hero p {
        font-size: 1.1rem;
      }
    }
    
    @media (max-width: 480px) {
      nav {
        flex-wrap: wrap;
        justify-content: center;
      }
      
      .hero h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body class="bg-loading">
  <div id="bg-animation"></div>

  <header>
    <div class="logo">NoteHub</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="notes.html">Notes</a>
      <a href="upload.html">Upload</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="container hero">
    <h1>Smart Notes. Faster Learning.</h1>
    <p>Your entire study material organized in one place.</p>

    <div class="hero-actions">
      <a class="btn" href="notes.html">Browse Notes</a>
      <a class="btn ghost" href="upload.html">Upload</a>
    </div>
  </main>

  <footer>© 2025 NoteHub</footer>

  <!-- Load scripts with proper order and error handling -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    // Wait for DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize Vanta.js background effect
      try {
        const effect = VANTA.NET({
          el: "#bg-animation",
          color: 0x5cf0ff,
          backgroundColor: 0x020617,
          points: 12.00,
          maxDistance: 22.00,
          spacing: 18.00
        });
        
        // Remove loading class once effect is loaded
        document.body.classList.remove('bg-loading');
        
        // Handle window resize
        window.addEventListener('resize', function() {
          effect.resize();
        });
      } catch (error) {
        console.error('Error initializing background animation:', error);
        document.body.classList.remove('bg-loading');
      }
    });
  </script>
</body>
</html>
