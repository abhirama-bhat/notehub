<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — NoteHub</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="bg-animation"></div>

<header>
  <div class="logo">NoteHub</div>
  <nav>
    <a href="/">Home</a>
    <a href="/notes">Notes</a>
  </nav>
</header>

<main class="container page-hero">
  <h1>Admin Panel</h1>
  <p class="muted">Approve uploads and resolve issues.</p>

  <div class="admin-unlock-card card">
    <input id="pass" class="input" placeholder="Enter admin password">
    <button id="unlock" class="btn" style="width:100%">Unlock</button>
  </div>

  <div id="adminArea" style="display:none">
    <div style="display:flex; gap:10px;">
      <button id="tabUploads" class="btn small">Pending Uploads</button>
      <button id="tabIssues" class="btn small ghost">Issue Reports</button>
    </div>

    <div id="pendingUploads"></div>
    <div id="issueReports" style="display:none"></div>
  </div>
</main>

<footer>© 2025 NoteHub</footer>

<script type="module" src="/script.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  VANTA.NET({ el:"#bg-animation", color:0x5cf0ff, backgroundColor:0x020617 });
});
</script>

</body>
</html>
